name: Flutter Mobile Tests

# Runs integration tests for embedded DB drivers (SQLite, DuckDB) on real
# Android emulators and iOS simulators.
#
# ─── Why a separate workflow? ────────────────────────────────────────────────
# GitHub Actions service containers and Docker steps only work on Linux.
# Android emulators need KVM (Linux), iOS simulators need macOS. These jobs
# are slower and more expensive than the desktop/server jobs in ci.yml, so
# they run on their own schedule to avoid blocking the main CI pipeline.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'drivers/knex_dart_sqlite/**'
      - 'drivers/knex_dart_duckdb/**'
      - 'lib/**'
      - 'test_apps/flutter_embedded/**'
      - '.github/workflows/flutter_mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'drivers/knex_dart_sqlite/**'
      - 'drivers/knex_dart_duckdb/**'
      - 'lib/**'
      - 'test_apps/flutter_embedded/**'
      - '.github/workflows/flutter_mobile.yml'
  workflow_dispatch:   # Allow manual runs

concurrency:
  group: flutter-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # Android — API 31 (Android 12)  ·  x86_64 emulator on Linux + KVM
  # ════════════════════════════════════════════════════════════════════════════
  test-android:
    name: Test Android (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31]

    steps:
      - uses: actions/checkout@v4

      # ── Flutter SDK ─────────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'   # Dart 3.6+ ships with Flutter 3.27
          channel: stable
          cache: true

      # ── Enable KVM for hardware acceleration ────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Scaffold the Flutter project (platform dirs only) ──────────────────
      # flutter create generates AndroidManifest, build.gradle, Podfile, etc.
      # We keep our committed pubspec.yaml / lib/ / integration_test/ and only
      # pull in the Android-specific boilerplate that we don't commit.
      - name: Scaffold Android platform files
        run: |
          flutter create \
            --no-pub \
            --org com.knexdart \
            --project-name flutter_embedded_test \
            --platforms android \
            /tmp/flutter_scaffold
          # Copy generated android/ dir into our test app (skip if already present)
          if [ ! -d test_apps/flutter_embedded/android ]; then
            cp -r /tmp/flutter_scaffold/android test_apps/flutter_embedded/
          fi

      # ── Resolve dependencies ────────────────────────────────────────────────
      - name: flutter pub get
        working-directory: test_apps/flutter_embedded
        run: flutter pub get

      # ── AVD cache (speeds up subsequent runs significantly) ─────────────────
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64

      - name: Create AVD (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD created"

      # ── Run integration tests ───────────────────────────────────────────────
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd test_apps/flutter_embedded
            flutter test integration_test/embedded_test.dart \
              --timeout 120s \
              -d emulator-5554

  # ════════════════════════════════════════════════════════════════════════════
  # iOS — latest available simulator  ·  macOS runner
  # ════════════════════════════════════════════════════════════════════════════
  test-ios:
    name: Test iOS Simulator
    runs-on: macos-latest   # Includes Xcode + iOS simulators

    steps:
      - uses: actions/checkout@v4

      # ── Flutter SDK ─────────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      # ── Scaffold the Flutter project (iOS platform files) ──────────────────
      - name: Scaffold iOS platform files
        run: |
          flutter create \
            --no-pub \
            --org com.knexdart \
            --project-name flutter_embedded_test \
            --platforms ios \
            /tmp/flutter_scaffold
          if [ ! -d test_apps/flutter_embedded/ios ]; then
            cp -r /tmp/flutter_scaffold/ios test_apps/flutter_embedded/
          fi

      # ── Resolve dependencies ────────────────────────────────────────────────
      - name: flutter pub get
        working-directory: test_apps/flutter_embedded
        run: flutter pub get

      # ── CocoaPods ──────────────────────────────────────────────────────────
      - name: pod install
        working-directory: test_apps/flutter_embedded/ios
        run: pod install

      # ── Boot iOS simulator ──────────────────────────────────────────────────
      - name: Boot latest iPhone simulator
        id: boot-sim
        run: |
          # Find the first available iPhone from the latest iOS runtime
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import sys, json, re
          data = json.load(sys.stdin)['devices']
          # Sort runtimes so highest iOS version wins
          for runtime in sorted(data.keys(), reverse=True):
              if not re.search(r'iOS', runtime):
                  continue
              for d in data[runtime]:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      exit()
          ")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "Booted simulator $UDID"

      # ── Run integration tests ───────────────────────────────────────────────
      - name: Run integration tests on iOS Simulator
        working-directory: test_apps/flutter_embedded
        run: |
          flutter test integration_test/embedded_test.dart \
            --timeout 180s \
            -d "$SIMULATOR_UDID"
