name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'knex_dart-v*.*.*'
      - 'knex_dart_postgres-v*.*.*'
      - 'knex_dart_mysql-v*.*.*'
      - 'knex_dart_sqlite-v*.*.*'
      - 'knex_dart_turso-v*.*.*'
      - 'knex_dart_d1-v*.*.*'
      - 'knex_dart_duckdb-v*.*.*'
      - 'knex_dart_snowflake-v*.*.*'
      - 'knex_dart_bigquery-v*.*.*'
      - 'knex_dart_mssql-v*.*.*'
      - 'knex_dart_otel-v*.*.*'
      - 'knex_dart_capabilities-v*.*.*'
      - 'knex_dart_lint-v*.*.*'
      - 'knex_dart_all-v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      publish_package:
        description: Package to publish after CI passes.
        required: true
        default: none
        type: choice
        options:
          - none
          - all
          - knex_dart
          - knex_dart_postgres
          - knex_dart_mysql
          - knex_dart_sqlite
          - knex_dart_turso
          - knex_dart_d1
          - knex_dart_duckdb
          - knex_dart_snowflake
          - knex_dart_bigquery
          - knex_dart_mssql
          - knex_dart_otel
          - knex_dart_capabilities
          - knex_dart_lint

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # 1 · Static analysis
  # ════════════════════════════════════════════════════════════════════════════
  analyze:
    name: Analyze (Dart packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - run: dart pub global activate melos
      - run: melos run analyze

  # ════════════════════════════════════════════════════════════════════════════
  # 2 · Core unit tests + coverage  (Linux only — no DB)
  # ════════════════════════════════════════════════════════════════════════════
  test-core:
    name: Test & Coverage (core)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Run unit tests with coverage
        run: dart test packages/knex_dart/test --exclude-tags=postgres,mysql,sqlite,turso,bigquery,mssql,duckdb,d1,snowflake --coverage=coverage
      - name: Format coverage
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json --report-on=packages/knex_dart/lib
          sed -i 's|SF:.*/packages/knex_dart/lib|SF:packages/knex_dart/lib|' coverage/lcov.info
      - name: Check coverage ≥ 85%
        run: |
          COV=$(awk -F: '/^LF/{lf+=$2} /^LH/{lh+=$2} END{printf "%.1f", lh*100/lf}' coverage/lcov.info)
          echo "Coverage: ${COV}%"
          if awk "BEGIN{exit !(${COV} < 85)}"; then
            echo "::error::Coverage ${COV}% < 85%"
            exit 1
          fi
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════════════════
  # 3 · SQLite  ·  native platform matrix  (Linux · macOS · Windows)
  # ════════════════════════════════════════════════════════════════════════════
  test-sqlite:
    name: Test SQLite (${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # macOS ships sqlite3 with Xcode CLT — no extra step needed.

      - name: Install sqlite3.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://sqlite.org/2024/sqlite-dll-win-x64-3460100.zip"
          Invoke-WebRequest $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath $env:SystemRoot\System32 -Force

      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Run SQLite tests
        working-directory: drivers/knex_dart_sqlite
        run: dart test

  # ════════════════════════════════════════════════════════════════════════════
  # 4 · DuckDB  ·  native platform matrix  (Linux · macOS · Windows)
  # ════════════════════════════════════════════════════════════════════════════
  test-duckdb:
    name: Test DuckDB (${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DUCKDB_VERSION: v1.4.4
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Install DuckDB (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-linux-amd64.zip" \
            -o /tmp/libduckdb.zip
          sudo unzip -o /tmp/libduckdb.zip libduckdb.so -d /usr/local/lib/
          sudo ldconfig

      - name: Install DuckDB (macOS)
        if: runner.os == 'macOS'
        run: brew install duckdb

      - name: Install DuckDB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/duckdb/duckdb/releases/download/$env:DUCKDB_VERSION/libduckdb-windows-amd64.zip"
          Invoke-WebRequest $url -OutFile duckdb.zip
          Expand-Archive duckdb.zip -DestinationPath $env:SystemRoot\System32 -Force

      - run: flutter pub get
      - name: Analyze DuckDB package
        working-directory: drivers/knex_dart_duckdb
        run: dart analyze --fatal-warnings
      - name: Run DuckDB tests
        working-directory: drivers/knex_dart_duckdb
        run: dart test

      - name: Download DuckDB WASM assets
        if: runner.os == 'Linux'
        working-directory: drivers/knex_dart_duckdb
        run: dart run tool/download_wasm.dart

      - name: Run DuckDB WASM tests (Chrome)
        if: runner.os == 'Linux'
        working-directory: drivers/knex_dart_duckdb
        # Only run query-builder / schema tests that don't need the native FFI.
        run: |
          dart test test/duckdb_test.dart --platform=chrome \
            --name "DuckDB — executeSchema"

  # ════════════════════════════════════════════════════════════════════════════
  # 5 · Embedded drivers  ·  Web/WASM  (SQLite WASM on Chrome)
  # ════════════════════════════════════════════════════════════════════════════
  test-embedded-wasm:
    name: Test SQLite (Web/WASM)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get

      # SQLite WASM — sqlite3 package exposes package:sqlite3/wasm.dart
      # dart test serves package assets from lib/ under relative packages/<pkg>/...
      - name: Download SQLite WASM asset
        working-directory: drivers/knex_dart_sqlite
        run: |
          SQLITE3_VERSION="$(ruby -rjson -e '
            cfg = JSON.parse(File.read("../../.dart_tool/package_config.json"))
            pkg = cfg["packages"].find { |p| p["name"] == "sqlite3" }
            abort("sqlite3 package not found in package_config") unless pkg
            root = pkg["rootUri"]
            root = root.sub(%r{\Afile://}, "") if root.start_with?("file://")
            root = File.expand_path(root, "../../.dart_tool") unless root.start_with?("/")
            version = File.basename(root)[/^sqlite3-(.+)$/, 1]
            abort("Could not infer sqlite3 version from #{root}") unless version
            puts version
          ')"

          URL_TAGGED="https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${SQLITE3_VERSION}/sqlite3.wasm"
          URL_LATEST="https://github.com/simolus3/sqlite3.dart/releases/latest/download/sqlite3.wasm"
          URL_VERSIONED_V="https://github.com/simolus3/sqlite3.dart/releases/download/v${SQLITE3_VERSION}/sqlite3.wasm"
          URL_VERSIONED_RAW="https://github.com/simolus3/sqlite3.dart/releases/download/${SQLITE3_VERSION}/sqlite3.wasm"

          mkdir -p lib/web_assets
          curl -fL "$URL_TAGGED" -o lib/web_assets/sqlite3.wasm \
            || curl -fL "$URL_LATEST" -o lib/web_assets/sqlite3.wasm \
            || curl -fL "$URL_VERSIONED_V" -o lib/web_assets/sqlite3.wasm \
            || curl -fL "$URL_VERSIONED_RAW" -o lib/web_assets/sqlite3.wasm
          ls -lh lib/web_assets/sqlite3.wasm

      - name: Run SQLite WASM tests (Chrome)
        working-directory: drivers/knex_dart_sqlite
        run: dart test --platform=chrome

  # ════════════════════════════════════════════════════════════════════════════
  # 6 · HTTP drivers  ·  native platform matrix  (Linux · macOS · Windows)
  #   Split by driver so one failure doesn't block the others.
  # ════════════════════════════════════════════════════════════════════════════
  test-http-native-turso:
    name: Test Turso (native, ${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Turso mock tests
        working-directory: drivers/knex_dart_turso
        run: dart test test/turso_test.dart

  test-http-native-d1:
    name: Test D1 (native, ${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: D1 mock tests
        working-directory: drivers/knex_dart_d1
        run: dart test test/d1_test.dart

  test-http-native-snowflake:
    name: Test Snowflake (native, ${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Snowflake mock tests
        working-directory: drivers/knex_dart_snowflake
        run: dart test test/snowflake_test.dart

  test-http-native-bigquery:
    name: Test BigQuery (native, ${{ matrix.os }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: BigQuery mock tests
        working-directory: drivers/knex_dart_bigquery
        run: dart test test/bigquery_test.dart

  # ════════════════════════════════════════════════════════════════════════════
  # 7 · HTTP drivers  ·  Web/WASM  (Chrome headless)
  #   The http package uses the browser's fetch API on web — no dart:io needed.
  # ════════════════════════════════════════════════════════════════════════════
  test-http-wasm:
    name: Test HTTP drivers (Web/WASM)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get

      - name: Turso mock tests (Chrome)
        working-directory: drivers/knex_dart_turso
        run: dart test test/turso_test.dart --platform=chrome

      - name: D1 mock tests (Chrome)
        working-directory: drivers/knex_dart_d1
        run: dart test test/d1_test.dart --platform=chrome

      - name: Snowflake mock tests (Chrome)
        working-directory: drivers/knex_dart_snowflake
        run: dart test test/snowflake_test.dart --platform=chrome

      - name: BigQuery mock tests (Chrome)
        working-directory: drivers/knex_dart_bigquery
        run: dart test test/bigquery_test.dart --platform=chrome

  # ════════════════════════════════════════════════════════════════════════════
  # 8 · PostgreSQL  ·  Linux + Docker service
  # ════════════════════════════════════════════════════════════════════════════
  test-postgres:
    name: Test PostgreSQL (Linux/Docker)
    needs: analyze
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knex
          POSTGRES_PASSWORD: knex
          POSTGRES_DB: knex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Load schema + seed
        working-directory: drivers/knex_dart_postgres
        run: |
          psql -h localhost -U knex -d knex_test \
            -f test/integration/sql/postgres_schema.sql
          psql -h localhost -U knex -d knex_test \
            -f test/integration/sql/postgres_seed.sql
        env: { PGPASSWORD: knex }
      - name: Run PostgreSQL tests
        working-directory: drivers/knex_dart_postgres
        run: dart test --tags=postgres
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: knex_test
          PG_USER: knex
          PG_PASSWORD: knex

  # ════════════════════════════════════════════════════════════════════════════
  # 9 · MySQL  ·  Linux + Docker service
  # ════════════════════════════════════════════════════════════════════════════
  test-mysql:
    name: Test MySQL (Linux/Docker)
    needs: analyze
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: knex_test
          MYSQL_USER: knex
          MYSQL_PASSWORD: knex
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Load schema + seed
        working-directory: drivers/knex_dart_mysql
        run: |
          mysql -h 127.0.0.1 -u root -proot \
            -e "ALTER USER 'knex'@'%' IDENTIFIED WITH mysql_native_password BY 'knex'; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -u knex -pknex knex_test \
            < test/integration/sql/mysql_schema.sql
          mysql -h 127.0.0.1 -u knex -pknex knex_test \
            < test/integration/sql/mysql_seed.sql
      - name: Run MySQL tests
        working-directory: drivers/knex_dart_mysql
        run: dart test --tags=mysql
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: knex_test
          MYSQL_USER: knex
          MYSQL_PASSWORD: knex

  # ════════════════════════════════════════════════════════════════════════════
  # 10 · SQL Server (MSSQL)  ·  Linux + Docker service
  # ════════════════════════════════════════════════════════════════════════════
  test-mssql:
    name: Test SQL Server (Linux/Docker)
    needs: analyze
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Knex_Test1!"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Knex_Test1!' -Q 'SELECT 1' -No -C"
          --health-interval 10s --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Install FreeTDS runtime
        run: sudo apt-get update && sudo apt-get install -y libsybdb5 freetds-dev freetds-bin
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Create knex_test database
        run: |
          # sqlcmd lives inside the service container — use docker exec
          MSSQL_CID=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          docker exec "$MSSQL_CID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Knex_Test1!' \
            -Q "IF DB_ID('knex_test') IS NULL CREATE DATABASE knex_test" \
            -No -C
      - name: Run MSSQL tests
        working-directory: drivers/knex_dart_mssql
        run: |
          # mssql_connection uses global FFI callbacks; keep one test process
          # per file to avoid cross-isolate callback crashes in CI.
          dart test test/integration/mssql_test.dart --concurrency=1
          dart test test/integration/mssql_pipeline_test.dart --concurrency=1
          dart test test/integration/schema_api_integration_test.dart --concurrency=1
        env:
          MSSQL_HOST: localhost
          MSSQL_PORT: "1433"
          MSSQL_DATABASE: knex_test
          MSSQL_USER: sa
          MSSQL_PASSWORD: "Knex_Test1!"

  # ════════════════════════════════════════════════════════════════════════════
  # 11 · Turso  ·  sqld integration  (Linux + Docker service)
  # ════════════════════════════════════════════════════════════════════════════
  test-turso-integration:
    name: Test Turso/sqld (Linux/Docker)
    needs: analyze
    runs-on: ubuntu-latest
    services:
      sqld:
        image: ghcr.io/libsql/sqld:latest
        env: { SQLD_NODE: primary }
        ports: ["18080:8080"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/8080' 2>/dev/null"
          --health-interval 5s --health-timeout 3s --health-retries 20
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: Run Turso mock tests
        working-directory: drivers/knex_dart_turso
        run: dart test test/turso_test.dart
      - name: Run Turso integration tests (real sqld)
        working-directory: drivers/knex_dart_turso
        run: dart test test/integration --tags=turso
        env: { TURSO_URL: "http://127.0.0.1:18080" }

  # ════════════════════════════════════════════════════════════════════════════
  # 12 · BigQuery  ·  emulator integration  (Linux + Docker service)
  # ════════════════════════════════════════════════════════════════════════════
  test-bigquery-integration:
    name: Test BigQuery emulator (Linux/Docker)
    needs: analyze
    runs-on: ubuntu-latest
    # Note: GitHub Actions service containers cannot pass CMD args (only docker
    # run flags via `options`).  The bigquery-emulator requires --project and
    # --dataset args, so we start it as a background step instead.
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get

      - name: Start BigQuery emulator
        run: |
          docker run -d \
            --name bigquery-emulator \
            -p 9050:9050 \
            ghcr.io/goccy/bigquery-emulator:latest \
            --project=knex-test \
            --dataset=knex_dataset \
            --port=9050
          # Wait up to 30 s for the emulator to become healthy
          for i in $(seq 1 15); do
            if curl -sf http://localhost:9050/bigquery/v2/projects/knex-test/datasets \
                 > /dev/null 2>&1; then
              echo "BigQuery emulator ready"
              break
            fi
            echo "Waiting… ($i/15)"
            sleep 2
          done

      - name: Run BigQuery mock tests
        working-directory: drivers/knex_dart_bigquery
        run: dart test test/bigquery_test.dart
      - name: Run BigQuery integration tests (emulator)
        working-directory: drivers/knex_dart_bigquery
        run: dart test test/integration/bigquery_integration_test.dart --tags=bigquery
        env:
          BIGQUERY_EMULATOR_HOST: http://localhost:9050
          BIGQUERY_PROJECT: knex-test
          BIGQUERY_DATASET: knex_dataset

  # ════════════════════════════════════════════════════════════════════════════
  # 13 · Package tests  (capabilities + lint)
  # ════════════════════════════════════════════════════════════════════════════
  test-packages:
    name: Test (packages)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: capabilities
        working-directory: packages/knex_dart_capabilities
        run: dart test
      - name: lint
        working-directory: packages/knex_dart_lint
        run: dart test

  # ════════════════════════════════════════════════════════════════════════════
  # 14 · Integration packages
  # ════════════════════════════════════════════════════════════════════════════
  test-otel:
    name: Test OpenTelemetry integration
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Resolve Dart workspace
        shell: bash
        run: |
          sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
          dart pub get
      - name: otel
        working-directory: integrations/knex_dart_otel
        run: dart test

  # ════════════════════════════════════════════════════════════════════════════
  # 15 · Publish  (release tags or explicit workflow dispatch)
  # ════════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish to pub.dev
    needs:
      - test-core
      - test-sqlite
      - test-duckdb
      - test-http-native-turso
      - test-http-native-d1
      - test-http-native-snowflake
      - test-http-native-bigquery
      - test-http-wasm
      - test-postgres
      - test-mysql
      - test-mssql
      - test-turso-integration
      - test-bigquery-integration
      - test-packages
      - test-otel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_package != 'none')
    environment: pub.dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package to publish
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.publish_package }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            knex_dart-v*)              echo "package=knex_dart" ;;
            knex_dart_postgres-v*)     echo "package=knex_dart_postgres" ;;
            knex_dart_mysql-v*)        echo "package=knex_dart_mysql" ;;
            knex_dart_sqlite-v*)       echo "package=knex_dart_sqlite" ;;
            knex_dart_turso-v*)        echo "package=knex_dart_turso" ;;
            knex_dart_d1-v*)           echo "package=knex_dart_d1" ;;
            knex_dart_duckdb-v*)       echo "package=knex_dart_duckdb" ;;
            knex_dart_snowflake-v*)    echo "package=knex_dart_snowflake" ;;
            knex_dart_bigquery-v*)     echo "package=knex_dart_bigquery" ;;
            knex_dart_mssql-v*)        echo "package=knex_dart_mssql" ;;
            knex_dart_otel-v*)         echo "package=knex_dart_otel" ;;
            knex_dart_capabilities-v*) echo "package=knex_dart_capabilities" ;;
            knex_dart_lint-v*)         echo "package=knex_dart_lint" ;;
            knex_dart_all-v*)          echo "package=all" ;;
            *) echo "Unsupported tag: $TAG" >&2; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"
      - uses: dart-lang/setup-dart@v1
        if: steps.resolve.outputs.package != 'knex_dart_duckdb' && steps.resolve.outputs.package != 'all'
        with: { sdk: stable }
      - uses: subosito/flutter-action@v2
        if: steps.resolve.outputs.package == 'knex_dart_duckdb' || steps.resolve.outputs.package == 'all'
        with: { channel: stable }
      - name: Remove DuckDB from Dart-only workspace
        if: steps.resolve.outputs.package != 'knex_dart_duckdb' && steps.resolve.outputs.package != 'all'
        shell: bash
        run: sed -i.bak "/knex_dart_duckdb/d" pubspec.yaml
      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: ^7.0.0
      - name: Publish dry-run
        if: steps.resolve.outputs.package != 'all'
        run: melos publish --scope="${{ steps.resolve.outputs.package }}" --no-private --yes
      - name: Publish dry-run (all)
        if: steps.resolve.outputs.package == 'all'
        run: melos publish --no-private --yes
      - name: Publish
        if: steps.resolve.outputs.package != 'all'
        run: melos publish --scope="${{ steps.resolve.outputs.package }}" --no-private --no-dry-run --yes
      - name: Publish all
        if: steps.resolve.outputs.package == 'all'
        run: melos publish --no-private --no-dry-run --yes
