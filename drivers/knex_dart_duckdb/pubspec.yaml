name: knex_dart_duckdb
description: DuckDB driver for knex_dart — execute analytical SQL queries against DuckDB using the knex_dart query builder and the dart_duckdb FFI package.
version: 0.2.1
repository: https://github.com/kartikey321/knex-dart
homepage: https://github.com/kartikey321/knex-dart
issue_tracker: https://github.com/kartikey321/knex-dart/issues
topics:
  - sql
  - query-builder
  - database
  - duckdb
  - knex

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  knex_dart: ^1.3.0
  dart_duckdb: ^1.4.4
  wasm_ffi: ^2.3.0
  universal_io: ^2.2.2

dev_dependencies:
  test: ^1.31.0
  lints: ^6.1.0
