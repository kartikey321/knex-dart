name: knex_dart_otel
description: OpenTelemetry instrumentation for knex_dart driver wrappers — query spans and DB client duration metrics via the OTel API.
version: 0.1.1
repository: https://github.com/kartikey321/knex-dart
homepage: https://github.com/kartikey321/knex-dart
issue_tracker: https://github.com/kartikey321/knex-dart/issues
topics:
  - sql
  - query-builder
  - opentelemetry
  - observability
  - knex

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  knex_dart: ^1.3.0
  # Pinned exact (not ^0.9.0): 0.9.1 backported the 1.0.0-rc.1 span-recording
  # model as a patch release, breaking API-only attribute reads. Tracking
  # upstream at https://github.com/MindfulSoftwareLLC/dartastic_opentelemetry/issues/93.
  dartastic_opentelemetry_api: 0.9.0

dev_dependencies:
  test: ^1.25.6
  lints: ^6.0.0
