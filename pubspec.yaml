name: knex_dart_workspace
description: Workspace root for knex-dart packages.
publish_to: none
repository: https://github.com/kartikey321/knex-dart
homepage: https://github.com/kartikey321/knex-dart
issue_tracker: https://github.com/kartikey321/knex-dart/issues

environment:
  sdk: ^3.10.0

workspace:
  - packages/knex_dart
  - drivers/knex_dart_postgres
  - drivers/knex_dart_mysql
  - drivers/knex_dart_sqlite
  - drivers/knex_dart_turso
  - drivers/knex_dart_d1
  - drivers/knex_dart_duckdb
  - drivers/knex_dart_snowflake
  - drivers/knex_dart_bigquery
  - drivers/knex_dart_mssql
  - packages/knex_dart_capabilities
  - packages/knex_dart_lint

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-warnings
      exec:
        # Run sequentially to avoid analyzer plugin cache race conditions
        # (custom_lint plugin AOT snapshot truncation in CI).
        concurrency: 1
    test:
      run: dart test
      exec:
        concurrency: 4
    test:unit:
      run: dart test --exclude-tags=postgres,mysql,sqlite
      exec:
        concurrency: 1
        packageFilters:
          scope: knex_dart
