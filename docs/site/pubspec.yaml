name: site
description: A documentation site built with Jaspr
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.1
  jaspr_content: ^0.5.2
  jaspr_router: ^0.8.2
  knex_dart:
    path: ../../packages/knex_dart
  syntax_highlight_lite: ^0.0.1
  universal_html: ^2.3.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.4.7
  jaspr_builder: ^0.23.1
  lints: ^6.1.0

jaspr:
  mode: static
